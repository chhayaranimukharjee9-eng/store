<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>Nexus Tools</title>
<style>
:root{--bg:#0b1020;--card:#121a33;--line:rgba(255,255,255,.08);--text:#e8ecf8;--mut:#93a0c0;--a1:#6366f1;--a2:#22d3a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
header a,header button{color:var(--text);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:640px;margin:0 auto;padding:16px}
.hero{border-radius:18px;padding:18px;margin-bottom:14px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.hero h2{margin:0 0 4px;font-size:20px}.hero p{margin:0;opacity:.9;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h4{margin:0 0 8px;font-size:14px}
.grid{display:grid;gap:12px}
.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.inp{position:relative}.inp em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mut);font-size:12px;pointer-events:none}
input,select,textarea{width:100%;background:#0d1530;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a1)}
textarea{resize:vertical}input[type=color]{padding:3px;height:46px;width:60px}
.chk{display:flex;align-items:center;gap:10px;color:var(--text)}.chk input{width:20px;height:20px;accent-color:var(--a1)}
.btns{display:flex;gap:10px;margin:12px 0}.btn{flex:1;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:0;border-radius:12px;padding:13px;font:600 15px system-ui;cursor:pointer}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}.btn.sm{flex:none;padding:10px 14px;font-size:13px}
.two{display:flex;gap:10px}.two input{flex:1}
.res{display:grid;gap:10px}.r{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.r small{display:block;color:var(--mut);font-size:12px}.r b{display:block;font-size:18px;margin-top:2px}.r i{display:block;font-style:normal;color:var(--mut);font-size:12px;margin-top:2px}
.r.hero{background:linear-gradient(135deg,var(--a1),var(--a2));border:0;color:#fff}.r.hero small,.r.hero i{color:rgba(255,255,255,.85)}.r.hero b{font-size:28px}
.res h4{margin:6px 0 0;font-size:13px;color:var(--mut)}.note,.hint{color:var(--mut);font-size:12.5px;margin:2px 2px}
.out{margin:12px 0}.click{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-weight:500;text-align:left;font-size:12px}td,th{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}
.big{text-align:center;padding:22px 14px}.big small{color:var(--mut);letter-spacing:.12em;font-size:12px}.clock{font:700 56px/1.1 ui-monospace,Menlo,monospace;margin:6px 0}.clock.sm{font-size:30px;font-family:inherit;word-break:break-word}.sub{color:var(--mut);font-size:13px}
.big.work{background:linear-gradient(135deg,#065f46,#047857)}.big.rest{background:linear-gradient(135deg,#1e3a8a,#1d4ed8)}
.bar{height:10px;background:#0d1530;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 10px;cursor:pointer}.done{text-decoration:line-through;color:var(--mut)}
.pill{background:#0d1530;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mut)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.dot{background:#0d1530;border:1px solid var(--line);border-radius:12px;padding:8px 0;color:var(--text);font:600 14px system-ui;cursor:pointer}.dot small{display:block;color:var(--mut);font-size:10px}.dot.on{background:linear-gradient(135deg,var(--a1),var(--a2));border:0;color:#fff}.dot.on small{color:#fff}
.cats .cr{display:grid;grid-template-columns:70px 1fr 56px;gap:8px;align-items:center;margin:8px 0;font-size:13px}.cats b{font-size:13px;text-align:right}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:600 13px system-ui;cursor:pointer}.tab.on{background:var(--a1);color:#fff;border-color:var(--a1)}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chips2 .btn{flex:none}
.pw{font:600 20px ui-monospace,Menlo,monospace;word-break:break-all;background:#0d1530;border-radius:12px;padding:14px;margin-bottom:6px}
.sw{height:90px;border-radius:14px;margin-bottom:12px;border:1px solid var(--line)}.shades{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.shades button{height:54px;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:9px;text-shadow:0 0 3px #000;cursor:pointer}
.ans{font:700 24px system-ui;margin-top:10px;color:var(--a2)}
.tg{font:17px/1.7 ui-monospace,Menlo,monospace;margin-bottom:12px;word-break:break-word}.tg .ok{color:#34d399}.tg .bad{color:#f87171;background:rgba(248,113,113,.15)}.tg .cur{background:var(--a1);color:#fff;border-radius:3px}
.rx{height:300px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;font-size:28px;gap:6px;transition:background .1s}
.rx small{font-size:14px;opacity:.85}.rx.wait0,.rx.res{background:#1e293b}.rx.wait{background:#b91c1c}.rx.go{background:#16a34a}.rx.early{background:#a16207}
.search{margin-bottom:12px}.cat{margin:18px 2px 8px;color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.t{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-decoration:none;color:var(--text)}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}.t b{font-size:13.5px;line-height:1.25}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#fff;color:#111;padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>

 init:()=>{const S=["The quick brown fox jumps over the lazy dog while the sun sets slowly behind the distant green hills.","Regular exercise and good sleep help your body recover so that you can lift heavier and run faster each week.","Small steps taken every day will always beat big plans that are never started, so begin now and keep going.","A good developer writes simple code that other people can read, test and change without any fear at all.","Drinking enough water, eating real food and moving every day are the three habits that change your life."];let tx="",t0=0,iv=null,over=false;const best=()=>store.get("typebest",0);const load=()=>{clearInterval(iv);over=false;t0=0;tx=S[Math.floor(Math.random()*S.length)];$("#ti").value="";$("#ti").disabled=false;$("#out").innerHTML=best()?renderRes([["Your best",best()+" WPM"]]):"";paint("")};const paint=v=>{$("#tg").innerHTML=[...tx].map((c,i)=>`<span class="${i<v.length?(v[i]===c?"ok":"bad"):i===v.length?"cur":""}">${esc(c)}</span>`).join("");const L=+$("#dur").value;$("#tm").textContent=t0?"Time left: "+Math.max(0,Math.ceil(L-(Date.now()-t0)/1000))+" s":"Timer starts when you type"};const fin=()=>{if(over)return;over=true;clearInterval(iv);$("#ti").disabled=true;const v=$("#ti").value;let ok=0;[...v].forEach((c,i)=>{if(c===tx[i])ok++});const mins=Math.max((Date.now()-t0)/60000,1/600),wpm=Math.round(ok/5/mins),acc=v.length?Math.round(ok/v.length*100):0;if(wpm>best())store.set("typebest",wpm);$("#out").innerHTML=renderRes([["Speed",wpm+" WPM",wpm>=60?"Excellent":wpm>=40?"Good":"Keep practising"],["Accuracy",acc+"%"],["Your best",Math.max(wpm,best())+" WPM"]])};$("#ti").addEventListener("input",()=>{const v=$("#ti").value;if(!t0){t0=Date.now();iv=setInterval(()=>{paint($("#ti").value);if(Date.now()-t0>=+$("#dur").value*1000)fin()},250)}paint(v);if(v.length>=tx.length)fin()});$("#nw").onclick=load;$("#dur").onchange=load;onLeave(()=>clearInterval(iv));load()}},

 init:()=>{const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b,turn,over,sc={X:0,O:0,D:0};const win=(b)=>{for(const l of W)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]];return b.every(Boolean)?"D":null};const mm=(b,p)=>{const w=win(b);if(w)return{s:w==="O"?1:w==="X"?-1:0};let best=null;b.forEach((v,i)=>{if(v)return;b[i]=p;const r=mm(b,p==="O"?"X":"O");b[i]="";const s=r.s;if(best===null||(p==="O"?s>best.s:s<best.s))best={s,i}});return best};const draw=()=>{$("#bd").innerHTML=b.map((v,i)=>`<button data-i="${i}" style="height:86px;border-radius:14px;border:1px solid var(--line);background:#0d1530;color:${v==="X"?"var(--a1)":"var(--a2)"};font:700 38px system-ui;cursor:pointer">${v}</button>`).join("");$$("[data-i]").forEach(e=>e.onclick=()=>play(+e.dataset.i));$("#sc").textContent="X wins "+sc.X+"  |  O wins "+sc.O+"  |  Draws "+sc.D;const w=win(b);$("#ti").textContent=w?(w==="D"?"It is a draw":w+" wins"):"Turn: "+turn};const fin=()=>{const w=win(b);if(w){over=true;sc[w]++;draw();return true}return false};const play=i=>{if(over||b[i])return;b[i]=turn;if(fin())return;turn=turn==="X"?"O":"X";if($("#md").value==="ai"&&turn==="O"){const r=mm(b,"O");b[r.i]="O";if(fin())return;turn="X"}draw()};const nw=()=>{b=Array(9).fill("");turn="X";over=false;draw()};$("#nw").onclick=nw;$("#md").onchange=nw;nw()}},
