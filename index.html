<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<title>Nexus Store</title>
<style>
:root{--bg:#0b1020;--bg2:#121a30;--card:#18213b;--line:#25304f;--text:#eef2ff;--muted:#8b97b8;--accent:#22d3a0;--accent2:#6366f1;--danger:#f43f5e;--star:#fbbf24}
[data-theme=light]{--bg:#f4f6fb;--bg2:#ffffff;--card:#ffffff;--line:#e3e8f2;--text:#0f172a;--muted:#64748b;--accent:#0ea57a;--accent2:#4f46e5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 10%,color-mix(in srgb,var(--accent2) 30%,transparent),transparent),radial-gradient(35% 30% at 85% 25%,color-mix(in srgb,var(--accent) 22%,transparent),transparent);animation:aurora 14s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate(4%,6%) scale(1.15)}}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{max-width:640px;margin:0 auto;min-height:100%;padding-bottom:90px}
#splash{position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,#6366f1,#22d3a0);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s}
#splash .logo{font-size:64px;animation:pop .8s ease}
#splash h1{margin-top:12px;font-size:28px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#offline{display:none;background:var(--danger);color:#fff;text-align:center;font-size:12px;padding:6px;position:sticky;top:0;z-index:60}

.top{position:sticky;top:0;z-index:20;padding:14px 16px 10px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px)}
.top .brand{font-weight:800;font-size:20px;flex:1}
.top .brand span{background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;flex:none}
.rankpill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 16px 10px}
.sec-h h2{font-size:18px}
.sec-h button{color:var(--accent);font-size:13px;font-weight:600}

.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px;scrollbar-width:none}
.hero::-webkit-scrollbar,.hrow::-webkit-scrollbar,.chips::-webkit-scrollbar,.shots::-webkit-scrollbar{display:none}
.slide{flex:0 0 88%;scroll-snap-align:center;border-radius:24px;padding:20px;min-height:180px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.slide .big{position:absolute;right:-6px;top:-6px;font-size:120px;opacity:.28;transform:rotate(-12deg)}
.slide small{opacity:.9;font-weight:700;letter-spacing:.5px}
.slide h3{font-size:24px;margin:4px 0}
.slide p{font-size:13px;opacity:.92;margin-bottom:12px}
.slide .go{align-self:flex-start;background:#fff;color:#111;padding:8px 18px;border-radius:20px;font-weight:700;font-size:13px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:.3s}
.dots i.on{width:18px;background:var(--accent)}
.aod{margin:16px;border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center;color:#fff;position:relative;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.12) inset,0 10px 30px rgba(0,0,0,.3)}
.aod .ico{width:84px;height:84px;font-size:40px;background:rgba(255,255,255,.2)!important;box-shadow:none;flex:none}
.aod small{font-weight:700;opacity:.9}.aod h3{font-size:20px;margin:2px 0}.aod p{font-size:12px;opacity:.9}
.aod .go{display:inline-block;margin-top:8px;background:#fff;color:#111;padding:6px 16px;border-radius:16px;font-weight:700;font-size:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px}
.chip{flex:none;padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04210f}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 16px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left}
.cbox big{font-size:30px;display:block}.cbox b{display:block;margin-top:6px}.cbox span{font-size:12px;color:var(--muted)}

.hrow{display:flex;gap:14px;overflow-x:auto;padding:4px 16px;scrollbar-width:none}
.tile{flex:0 0 96px;text-align:left}
.ico{width:96px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.ico img{width:100%;height:100%;object-fit:cover}
.tile b{display:block;font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:11px;color:var(--muted)}
.row{display:flex;gap:14px;align-items:center;padding:12px 16px}
.row .ico{width:64px;height:64px;border-radius:16px;font-size:30px;flex:none;box-shadow:none}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:15px}
.row .meta p{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta small{font-size:11px;color:var(--muted)}
.rank{width:22px;font-weight:800;color:var(--muted);text-align:center}
.pill{padding:8px 18px;border-radius:20px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:700;font-size:13px;flex:none}
.pill.done{background:var(--card);color:var(--muted)}
.pill.upd{background:var(--danger);color:#fff}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;background:color-mix(in srgb,var(--accent2) 22%,transparent);color:var(--accent2)}
.badge.hot{background:#f9731633;color:#f97316}.badge.editor{background:#fbbf2433;color:#d99a06}.badge.verified{background:#22d3a022;color:var(--accent)}

.sbox{margin:4px 16px 10px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 8px 0 14px}
.sbox input{flex:1;background:none;border:none;outline:none;color:var(--text);padding:14px 0;font-size:16px;min-width:0}
select.sort{margin:8px 16px;background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:12px}

#detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .35s ease;visibility:hidden}
#detail.open{transform:none;visibility:visible}
.dwrap{max-width:640px;margin:0 auto;padding-bottom:60px}
.dbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;display:flex;justify-content:space-between}
.dhead{display:flex;gap:16px;padding:6px 16px 0}
.dhead .ico{width:96px;height:96px;flex:none}
.dhead h1{font-size:22px}
.dhead .dev{color:var(--accent);font-size:14px;font-weight:600;margin-top:2px}
.dhead .cat{color:var(--muted);font-size:12px;margin-top:4px}
.stats{display:flex;margin:18px 16px;background:var(--card);border-radius:16px;padding:14px 0}
.stats div{flex:1;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border:none}
.stats b{display:block;font-size:15px}.stats span{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:10px;padding:0 16px}
.install{flex:1;padding:14px;border-radius:14px;background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff;font-weight:800;font-size:16px;position:relative;overflow:hidden}
.install .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.3);width:0}
.install span{position:relative}
.install.apk{background:linear-gradient(90deg,#15803d,#22c55e)}
.install.off{filter:grayscale(.7);opacity:.6}
.sq{width:50px;border-radius:14px;background:var(--card);font-size:20px}
.shots{display:flex;gap:10px;overflow-x:auto;padding:4px 16px;scrollbar-width:none}
.shot{flex:0 0 150px;height:270px;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:54px;color:#fff;text-align:center;cursor:zoom-in}
.shot img{width:100%;height:100%;object-fit:cover}
.video{margin:0 16px;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#000 center/cover;position:relative;display:flex;align-items:center;justify-content:center;font-size:50px;color:#fff}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.txt{padding:0 16px;color:var(--muted);line-height:1.75;font-size:14px}
.card2{margin:0 16px;background:var(--card);border-radius:16px;padding:14px;color:var(--muted);font-size:14px;line-height:1.7}
.perm{display:inline-block;background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:12px;font-size:12px;margin:3px 3px 0 0}
.stars{display:flex;gap:6px;padding:0 16px;font-size:34px}
.stars button{color:var(--line)}.stars button.on{color:var(--star)}
.rev{margin:10px 16px;background:var(--card);padding:12px 14px;border-radius:14px}
.rev b{font-size:13px}.rev .s{color:var(--star);font-size:12px;margin-left:6px}
.rev p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
.rev .del{float:right;color:var(--danger);font-size:12px}
.revav{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}
.form{margin:10px 16px;display:grid;gap:10px}
.form input,.form textarea,.form select{width:100%;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15px}
.lbl{font-size:12px;color:var(--muted);margin:4px 2px -4px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px}.chk input{width:auto}
.btn{padding:13px;border-radius:12px;background:var(--accent);color:#04210f;font-weight:800;text-align:center;display:block}
.btn:disabled{opacity:.5}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.wa{background:#25d366;color:#05260f}
.empty{text-align:center;color:var(--muted);padding:40px 20px;line-height:1.8}
.empty big{display:block;font-size:48px}
.set{margin:10px 16px;background:var(--card);border-radius:16px;overflow:hidden}
.set button{width:100%;text-align:left;padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-size:15px}
.set button:last-child{border:none}
.prof{margin:10px 16px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:22px;padding:18px}
.prof .r{font-size:44px;font-weight:900;float:right;opacity:.9}
.xpbar{height:10px;background:rgba(255,255,255,.3);border-radius:5px;margin-top:12px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .6s}
pre{background:#000;color:#9ef0c9;padding:12px;border-radius:12px;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:10px 16px}

/* login & profile */
.login{margin:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}
.login h3{margin:8px 0 6px}.login p{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:14px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#222;font-weight:700;padding:12px 20px;border-radius:26px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.gbtn b{font-size:20px;background:linear-gradient(45deg,#4285f4,#ea4335,#fbbc05,#34a853);-webkit-background-clip:text;background-clip:text;color:transparent}
.avatar{border-radius:50%;background:var(--accent2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.ucard{margin:10px 16px;background:var(--card);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.ucard .meta{min-width:0}.ucard b{display:block}.ucard small{color:var(--muted);font-size:12px;word-break:break-all}
.guest{margin:12px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent2) 25%,transparent),color-mix(in srgb,var(--accent) 20%,transparent));border:1px solid var(--line);border-radius:18px;padding:14px;font-size:13px;line-height:1.6;display:flex;gap:10px;align-items:center}
.guest button{flex:none;background:var(--accent);color:#04210f;font-weight:800;padding:8px 14px;border-radius:14px}

/* dashboard */
.top2{display:flex;align-items:center;gap:10px;padding:4px 16px}.top2 h2{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:24px;margin-top:2px}
.bars{margin:10px 16px;background:var(--card);border-radius:16px;padding:14px}
.bl{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px}
.bl span{width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.bl i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent));min-width:4px}
.drow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drow .ico{width:56px;height:56px;border-radius:14px;font-size:26px;flex:none;box-shadow:none}
.drow .meta{flex:1;min-width:0}.drow small{display:block;color:var(--muted);font-size:12px;margin-top:2px;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px}
.acts .ok{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}.acts .bad{color:var(--danger)}
.st{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}.st.ok{background:#22d3a022;color:var(--accent)}.st.wait{background:#fbbf2433;color:#d99a06}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--accent);font-weight:700}
.dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--danger)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(30px);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:400;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#viewer{position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.94);display:none;align-items:center;overflow-x:auto;gap:14px;padding:0 6vw;scroll-snap-type:x mandatory}
#viewer .vs{flex:0 0 78vw;max-width:360px;height:76vh;border-radius:22px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:90px;color:#fff;overflow:hidden}
#viewer img{width:100%;height:100%;object-fit:cover}
.conf{position:fixed;top:-30px;z-index:500;font-size:22px;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.iconbtn svg,.sico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.sico{display:flex;color:var(--muted)}
.cbox svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
nav button i{display:flex;height:23px}
nav button i svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:Poppins,Inter,sans-serif;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.blogo{width:28px;height:28px;border-radius:8px;vertical-align:-8px;margin-right:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.dbanner{margin:0 16px 16px;aspect-ratio:2/1;border-radius:20px;background-size:cover;background-position:center;box-shadow:0 10px 28px rgba(0,0,0,.35)}
#splash .logo{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="splash"><img id="spLogo" class="logo" alt=""><h1 id="spName"></h1></div>
<div id="offline">📡 You are offline</div>
<div id="app"></div>
<div id="detail"></div>
<div id="viewer" onclick="this.style.display='none'"></div>
<nav><div id="nav"></div></nav>
<div id="toast"></div>
<script src="assets.js"></script>
<script src="tools-assets.js"></script>
<script src="apps.js"></script>
<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const bn = n => String(n);
const fmt = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,"")+"K+" : n+"+";
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";
const IMGV = k => (typeof IMG!=="undefined" && IMG[k]) || "";
const safeImg = u => { u=String(u||""); if(u.indexOf("img:")===0) return IMGV(u.slice(4)); return /^https?:\/\//i.test(u) ? u : ""; };
const isImgRef = u => /^(https?:\/\/|img:)/i.test(String(u||""));
const cssUrl = t => /^[^'"()\s\\]+$/.test(t||"") ? t : "";
const installHelp = a => `<div class="card2" style="margin-top:14px"><b style="color:var(--text)">Two ways to use this app</b><br><b>Web app:</b> tap <b>Open web app</b>. To keep it on your home screen, open the browser menu and choose <b>Add to Home screen</b>.<br><b>Android APK:</b> tap <b>Download APK</b>, open the downloaded file, allow installs from this browser if Android asks, then tap Install.</div>`;
const typeChips = () => `<div class="chips">${[["all","All types"],["web","🌐 Web apps ("+bn(all().filter(a=>isWebList(a)).length)+")"],["apk","🤖 Android APKs ("+bn(all().filter(a=>hasApk(a)).length)+")"]].map(([k,l])=>`<button class="chip ${typeF===k?"on":""}" onclick="typeF='${k}';render()">${l}</button>`).join("")}</div>`;
const typeSec = (t,l,k) => l.length ? head(t,`<button onclick="typeF='${k}';go('explore')">See all</button>`)+`<div class="hrow">${l.map(tile).join("")}</div>` : "";
const SVG = {
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  share:'<path d="M12 15V4M8 8l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  home:'<path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  explore:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  library:'<rect x="4" y="4" width="5" height="16" rx="1.5"/><rect x="11" y="4" width="5" height="16" rx="1.5"/><path d="m18 6.2 2.6.8-3.2 12.4-2.4-.6"/>',
  profile:'<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c.8-4 4-5.5 7.5-5.5s6.7 1.5 7.5 5.5"/>',

function drow(a){
  const adm=isAdmin(), pub=a.status==="published";
  return `<div class="drow"><div class="ico" style="background:${grad(a)}" onclick="openApp('${a.id}')">${icon(a)}</div><div class="meta"><b>${esc(a.name)}</b> <span class="st" style="background:var(--card)">${kindTxt(a)}</span> <span class="st ${pub?"ok":"wait"}">${pub?"✔ Published":"⏳ Pending"}</span><small>⭐ ${rt(a)} • ${fmt(dl(a))} downloads • v${esc(a.version)}${adm&&a.dev?" • "+esc(a.dev):""}</small><div class="acts"><button onclick="editApp('${a.id}')">✏️ Edit</button>${adm?(pub?`<button onclick="setStatus('${a.id}','pending')">🙈 Hide</button>`:`<button class="ok" onclick="setStatus('${a.id}','published')">✅ Publish</button>`)+`<button onclick="toggleFeat('${a.id}')">${a.featured?"⭐ Unfeature":"☆ Feature"}</button>`:""}<button class="bad" onclick="delApp('${a.id}')">🗑️</button></div></div></div>`;
}
function ovHTML(){
  const pubs=adminApps.filter(a=>a.status==="published"), pend=adminApps.length-pubs.length;
  const sv=Object.values(cstats), rc=sv.reduce((s,x)=>s+(x.ratingCount||0),0), rsum=sv.reduce((s,x)=>s+(x.ratingSum||0),0);
  const totalDl=pubs.reduce((s,a)=>s+dl(a),0);
  const top5=[...pubs].sort((a,b)=>dl(b)-dl(a)).slice(0,5), mx=Math.max(1,...top5.map(dl));
  const kp=[["📦","Published apps",bn(pubs.length)],["⬇️","Total downloads",bn(totalDl)],["👥","Total users",ucount==null?"—":bn(ucount)],["⏳","Pending apps",bn(pend)],["🚩","Reports",bn(reports.length)],["⭐","Avg. rating",rc?bn((rsum/rc).toFixed(1)):"—"]];
  const seed=(!adminApps.length&&APPS.length)?`<div class="card2" style="margin-top:10px"><b style="color:var(--text)">🚀 Getting started</b><br>No apps in the cloud yet. Import the ${bn(APPS.length)} sample apps from apps.js in one click, then manage everything from this dashboard.<div style="margin-top:10px"><button class="btn" style="width:100%" onclick="importSeed()">⬆️ Import sample apps</button></div></div>`:"";
  return `<div class="kpis">${kp.map(k=>`<div class="kpi"><span>${k[0]} ${k[1]}</span><b>${k[2]}</b></div>`).join("")}</div>${seed}
  ${top5.length?`<div class="bars"><b>🏆 Most downloaded</b>${top5.map(a=>`<div class="bl"><span>${esc(a.name)}</span><i style="width:${Math.max(3,Math.round(dl(a)/mx*100))}%"></i><small>${bn(dl(a))}</small></div>`).join("")}</div>`:""}`;
}
function viewDash(){
  if(!CLOUD) return viewLocalAdmin();
  if(!user) return topbar()+head("📊 Dashboard")+loginCard("Log in to open the dashboard");
  const adm=isAdmin();
  const pend=adminApps.filter(a=>a.status!=="published");
  const tabs=adm?[["ov","📊 Overview"],["apps","📦 Apps ("+bn(adminApps.length)+")"],["pend","⏳ Pending ("+bn(pend.length)+")"],["rep","🚩 Reports ("+bn(reports.length)+")"],["newweb","🌐 Add web app"],["newapk","🤖 Add APK"]]:[["mine","📦 My apps"],["newweb","🌐 Add web app"],["newapk","🤖 Add APK"]];
  if(!tabs.some(t=>t[0]===dtab)) dtab=tabs[0][0];
  let body="";
  if(dtab==="newweb"||dtab==="newapk") body=(adm?"":`<div class="card2" style="margin-top:8px">After you submit your app, the admin reviews and publishes it. The link must start with <b>https://</b> . </div>`)+formHTML();
  else if(dtab==="ov") body=ovHTML();
  else if(dtab==="apps") body=adminApps.length?adminApps.map(drow).join(""):`<div class="empty"><big>📭</big>No apps yet. In the "Overview" tab, import the sample apps or add a new app</div>`;
  else if(dtab==="pend") body=pend.length?pend.map(drow).join(""):`<div class="empty"><big>✅</big>No pending apps</div>`;
  else if(dtab==="rep") body=reports.length?reports.map(r=>{ const a=byId(r.appId); return `<div class="drow"><div class="meta"><b>🚩 ${esc(a?a.name:r.appId)}</b><small>${esc(r.reason)}</small><div class="acts">${a?`<button onclick="openApp('${a.id}')">👀 View</button><button onclick="setStatus('${a.id}','pending')">🙈 Hide app</button>`:""}<button class="ok" onclick="dropReport('${esc(r._id)}')">✔ Dismiss</button></div></div></div>`; }).join(""):`<div class="empty"><big>🎉</big>No reports</div>`;
  else body=myApps.length?myApps.map(drow).join(""):`<div class="empty"><big>🚀</big>You have not submitted any app yet. Go to the "New app" tab and submit your first one!</div>`;
  return topbar()+`<div class="top2"><button class="iconbtn" onclick="go('settings')">←</button><h2>${adm?"👑 Admin dashboard":"📊 Developer dashboard"}</h2></div><div class="chips">${tabs.map(([k,l])=>`<button class="chip ${dtab===k?"on":""}" onclick="setD('${k}')">${l}</button>`).join("")}</div>`+body;
}

    <label class="chk"><input type="checkbox" id="f_feat" ${e.featured?"checked":""}> Feature on the home slider</label>`:""}
    ${CLOUD?`<button class="btn" id="savebtn" onclick="saveForm()">💾 ${adm?"Save":"Submit for review"}</button>`:`<button class="btn" onclick="genCode()">Generate code</button><button class="btn alt" onclick="testLocal()">Test on my phone only</button>`}
    ${editing&&CLOUD?`<button class="btn alt" onclick="editing=null;setD('${isAdmin()?"apps":"mine"}')">Cancel</button>`:""}

function readForm(){
  const g=i=>{ const el=$("#f_"+i); return el?String(el.value||""):""; };
  const name=g("name").trim(); if(!name){ toast("Enter the app name"); return null; }
  const link=g("link").trim();
  if(link&&link!=="#"&&!/^https?:\/\//i.test(link)){ toast("The link must start with https://"); return null; }
  const apk=g("apk").trim();
  if(apk&&apk!=="#"&&!/^https?:\/\//i.test(apk)){ toast("The APK link must start with https://"); return null; }
  const u=user||{uid:"local",email:"",name:"You"};
  const adm=isAdmin()||!CLOUD, old=editing||{};
  let id=old.id;
  if(!id){
    const known=new Set([...all(),...adminApps,...myApps].map(a=>a.id));
    id=slug(name)||"app"; if(!adm||known.has(id)) id+="-"+Math.random().toString(36).slice(2,6);
  }
  const list=(s,sep)=>s.split(sep).map(x=>x.trim()).filter(Boolean);
  const el=$("#f_feat");
  return {
    id, name, dev: old.dev||u.name||"Developer", icon:isImgRef(g("icon").trim())?g("icon").trim():"", banner:isImgRef(g("banner").trim())?g("banner").trim():"",
    color: PALETTE[Number(g("color"))||0], cat:g("cat").trim()||"Other", type:(apk&&!link)?"apk":"web", link:link||"#", apk:apk||"#",
    version:g("ver").trim()||"1.0.0", size:g("size").trim()||"3 MB", desc:g("desc").trim(), long:g("long").trim()||g("desc").trim(),
    whatsnew:g("new").trim(), perms:list(g("perms"),","), screenshots:list(g("shots"),"\n").filter(isImgRef),
    video:/^[\w-]{6,15}$/.test(g("video").trim())?g("video").trim():"", updated:new Date().toISOString().slice(0,10),
    rating: adm?(+old.rating||0):0, downloads: adm?(+old.downloads||0):0,
    price: adm?Math.max(0,Number(g("price"))||0):0, badge: adm?g("badge"):"", featured: adm?!!(el&&el.checked):false,
    status: adm?(old.status||"published"):"pending", ownerUid:old.ownerUid||u.uid, createdAt:old.createdAt||Date.now()
  };
}
async function saveForm(){
  const a=readForm(); if(!a) return;
  if(!window.cloud||!user){ toast("Please log in first"); return; }
  const btn=$("#savebtn"); if(btn) btn.disabled=true;
  try{
    await window.cloud.saveApp(a);
    toast(isAdmin()?"✅ Saved":"✅ Submitted! The admin will review and publish it");
    editing=null; dtab=isAdmin()?"apps":"mine"; await refreshDash(); loadPublic();
  }catch(e){ console.warn(e); toast("❌ Could not save. Check your login and Firebase rules"); if(btn) btn.disabled=false; }
}

/* ================= navigation ================= */
const TABS=[["home",SVG.home,"Home"],["explore",SVG.explore,"Explore"],["search",SVG.search,"Search"],["library",SVG.library,"Library"],["settings",SVG.profile,"Profile"]];
function go(t){ tab=t; closeApp(); render(); window.scrollTo(0,0); }
function render(){
  const v={home:viewHome,explore:viewExplore,search:viewSearch,library:viewLibrary,settings:viewSettings,dash:viewDash}[tab]();
  $("#app").innerHTML=v;
  const u=updates().length, adminDot=isAdmin()&&(adminApps.some(a=>a.status!=="published")||reports.length);
  $("#nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${(tab===k||(tab==="dash"&&k==="settings"))?"on":""}" onclick="go('${k}')"><i>${svgI(i)}</i>${l}${(k==="library"&&u)||(k==="settings"&&adminDot)?'<span class="dot"></span>':""}</button>`).join("");
  if(tab==="search") doSearch();
  if(tab==="home") initHero();
}
let heroTimer;
function initHero(){
  const h=$("#hero"); if(!h) return; const n=h.children.length; let i=0; const dots=[...$("#dots").children];
  h.addEventListener("scroll",()=>{ i=Math.round(h.scrollLeft/(h.scrollWidth/n)); dots.forEach((d,k)=>d.classList.toggle("on",k===i)); });
  clearInterval(heroTimer);
  heroTimer=setInterval(()=>{ if(!$("#hero")) return clearInterval(heroTimer); i=(i+1)%n; h.scrollTo({left:i*(h.scrollWidth/n),behavior:"smooth"}); },4000);
}

/* ================= app detail ================= */
let cur=null, detailOpen=false;
function reviewsHTML(id){
  const rs=reviewsOf(id), adm=isAdmin();
  return head("Reviews ("+bn(rs.length)+")") + (rs.length
    ? rs.slice().reverse().map(r=>`<div class="rev">${CLOUD&&adm&&/^[\w-]+$/.test(r.uid||"")?`<button class="del" onclick="delReview('${id}','${r.uid}')">🗑️</button>`:""}${CLOUD&&safeImg(r.photo)?`<img class="revav" src="${esc(safeImg(r.photo))}" referrerpolicy="no-referrer" alt="">`:""}<b>${esc(r.name)}</b><span class="s">${"★".repeat(Math.max(0,Math.min(5,r.stars|0)))}</span>${r.text?`<p>${esc(r.text)}</p>`:""}</div>`).join("")
    : `<div class="empty">${CLOUD&&crevLoaded[id]!==true?"⏳ Loading...":"No reviews yet. Be the first!"}</div>`);
}
function mineHTML(id){
  if(CLOUD){
    if(!user) return `<div class="card2">Log in to rate or review.</div><div style="padding:10px 16px 0"><button class="btn" style="width:100%" onclick="login()">Log in with Google</button></div>`;
    const m=mine[id], s=m?m.stars:0, t=drafts[id]!=null?drafts[id]:(m?m.text:"");
    return `<div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=s?"on":""}" onclick="rate(${n})">★</button>`).join("")}</div>
    <div class="form"><textarea id="rt" rows="3" maxlength="300" placeholder="How did you like the app? (optional)">${esc(t)}</textarea><button class="btn" onclick="addReview()">${m?"Update":"Submit"}</button></div>`;
  }
  const s=myRate[id]||0;
  return `<div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=s?"on":""}" onclick="rate(${n})">★</button>`).join("")}</div>
  <div class="form"><input id="rn" placeholder="Your name"><textarea id="rt" rows="2" placeholder="How did you like the app?"></textarea><button class="btn" onclick="addReview()">Submit</button></div>`;
}
function paintReviews(id){
  if(!cur||cur.id!==id) return;
  const b=$("#revbox"); if(b) b.innerHTML=reviewsHTML(id);
  const c=$("#revcnt"); if(c) c.textContent=bn(reviewsOf(id).length)+" reviews";
  const a=$("#avgb"); if(a) a.textContent="⭐ "+rt(cur);
}
function paintMine(id){
  if(!cur||cur.id!==id) return;
  const t=$("#rt"); if(t&&CLOUD) drafts[id]=t.value;
  const b=$("#myrev"); if(b) b.innerHTML=mineHTML(id);
}
const SHOT_P={};
function ensureShots(a){
  const f=(typeof TOOL_SHOTS!=="undefined")&&TOOL_SHOTS[a.id];
  if(!f||IMGV(a.id+"-1")) return;
  if(!SHOT_P[f]) SHOT_P[f]=new Promise(res=>{ const s=document.createElement("script"); s.src=f; s.onload=()=>res(true); s.onerror=()=>{ delete SHOT_P[f]; res(false); }; document.head.appendChild(s); });
  SHOT_P[f].then(ok=>{ if(ok&&cur&&cur.id===a.id&&detailOpen) openApp(a.id); });
}
function openApp(id){
  const a=byId(id); if(!a) return; cur=a; ensureShots(a);
  if(tab==="search"&&query.trim()){ hist=[query.trim(),...hist.filter(h=>h!==query.trim())].slice(0,6); ls.set("hist",hist); }
  if(!detailOpen){ try{ history.pushState({d:1},""); }catch(e){} detailOpen=true; }
  const rs=reviewsOf(id);
  const isIn=installed.includes(id), isW=wish.includes(id), upd=hasUpdate(a), paid=a.price>0;
  const shotArr=shotsOf(a);
  const shots=shotArr.map((s,i)=>`<div class="shot" onclick="viewShots(${i})"><img src="${esc(s)}" alt=""></div>`).join("");
  const similar=all().filter(x=>x.id!==id&&x.cat===a.cat);
  const wOk=hasWeb(a), kOk=hasApk(a), webTxt = paid&&!isIn ? `Contact to buy (${priceTxt(a)})` : "Open web app";
  const waLink = STORE.whatsapp ? `https://wa.me/${encodeURIComponent(STORE.whatsapp)}?text=${encodeURIComponent("Hello, I would like to know about "+a.name+" app")}` : "";
  const unpub = a.status && a.status!=="published";
  $("#detail").innerHTML=`<div class="dwrap">
    <div class="dbar"><button class="iconbtn" onclick="closeApp()">←</button><button class="iconbtn" onclick="shareApp()">${svgI(SVG.share)}</button></div>
    ${bannerSrc(a)&&cssUrl(bannerSrc(a))?`<div class="dbanner" style="background-image:url('${cssUrl(bannerSrc(a))}')"></div>`:""}
    <div class="dhead"><div class="ico" style="background:${grad(a)}">${icon(a)}</div><div><h1>${esc(a.name)}</h1><div class="dev">${esc(a.dev)}</div><div class="cat">${esc(a.cat)} • ${kindTxt(a)} ${badge(a)}${unpub?` <span class="st wait">⏳ Pending (preview)</span>`:""}</div></div></div>
    <div class="stats"><div><b id="avgb">⭐ ${rt(a)}</b><span id="revcnt">${bn(rs.length)} reviews</span></div><div><b>${fmt(dl(a))}</b><span>Downloads</span></div><div><b>${esc(a.size)}</b><span>Size</span></div><div><b>${esc(a.version)}</b><span>Version</span></div></div>
    <div class="actions"><button class="install ${wOk?"":"off"}" id="ibtn" onclick="openWeb()"><span>${webTxt}</span></button><button class="sq" onclick="toggleWish()">${isW?"❤️":"🤍"}</button></div>
    <div class="actions" style="margin-top:10px"><button class="install apk ${kOk?"":"off"}" onclick="getApk()"><span>${kOk?"Download Android APK":"Android APK - coming soon"}</span></button></div>
    ${isIn?`<div class="actions" style="margin-top:10px"><button class="btn alt" style="flex:1" onclick="uninstall()">🗑️ Remove from library</button></div>`:""}
    ${waLink?`<div style="padding:10px 16px 0"><a class="btn wa" href="${waLink}" target="_blank" rel="noopener">💬 Contact on WhatsApp</a></div>`:""}
    ${installHelp(a)}
    ${shotArr.length?head("Preview")+`<div class="shots">${shots}</div>`:""}
    ${a.video&&/^[\w-]{6,15}$/.test(a.video)?head("🎬 Trailer")+`<div class="video" style="background-image:url(https://img.youtube.com/vi/${esc(a.video)}/hqdefault.jpg)" onclick="playVid(this,'${esc(a.video)}')">▶️</div>`:""}
    ${head("About this app")}<div class="txt">${esc(a.long||a.desc)}<br><br>🕒 Last updated: ${esc(a.updated||"-")}</div>
    ${a.whatsnew?head("🆕 What's new")+`<div class="card2">${esc(a.whatsnew)}</div>`:""}
    ${a.perms&&a.perms.length?head("🔐 Permissions")+`<div class="card2">${a.perms.map(p=>`<span class="perm">${esc(p)}</span>`).join("")}</div>`:""}
    ${head("Rate and review")}<div id="myrev">${mineHTML(id)}</div>
    <div id="revbox">${reviewsHTML(id)}</div>
    ${CLOUD?`<div style="padding:14px 16px 0"><button class="btn alt" style="width:100%" onclick="reportApp()">🚩 Report this app</button></div>`:""}
    ${similar.length?head("Similar apps")+`<div class="hrow">${similar.map(tile).join("")}</div>`:""}
  </div>`;
  $("#detail").classList.add("open");
  if(CLOUD && window.cloud){
    if(!crevLoaded[id]){
      crevLoaded[id]="loading";
      window.cloud.loadReviews(id).then(l=>{ creviews[id]=l; crevLoaded[id]=true; paintReviews(id); }).catch(()=>{ crevLoaded[id]=true; paintReviews(id); });
    }
    if(user && mine[id]===undefined){
      mine[id]=null;
      window.cloud.getMyReview(id,user.uid).then(r=>{ mine[id]=r; paintMine(id); }).catch(()=>{});
    }
  }
}
function closeApp(fromPop){
  $("#detail").classList.remove("open");
  if(detailOpen){ detailOpen=false; if(!fromPop){ try{ history.back(); }catch(e){} } }
}
window.addEventListener("popstate",()=>{ if(detailOpen){ detailOpen=false; $("#detail").classList.remove("open"); } $("#viewer").style.display="none"; });
function playVid(el,id){ el.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`; el.removeAttribute("onclick"); }
function viewShots(i){
  const a=cur, v=$("#viewer"), arr=shotsOf(a); if(!arr.length) return;
  v.innerHTML=arr.map(s=>`<div class="vs"><img src="${esc(s)}" alt=""></div>`).join("");
  v.style.display="flex"; setTimeout(()=>{ const c=v.children[i]; if(c) c.scrollIntoView({inline:"center"}); },30);
}

/* ---- Download counting ---- */
function countDownload(a){
  if(counted.includes(a.id)) return;
  counted.push(a.id); ls.set("counted",counted);
  if(CLOUD){
    const s=cstats[a.id]=cstats[a.id]||{downloads:0,ratingSum:0,ratingCount:0}; s.downloads++;
    if(window.cloud) window.cloud.bump(a.id,1,0,0).catch(()=>{});
  } else a.downloads=(a.downloads||0)+1;
}
function markUsed(a){ if(!installed.includes(a.id)){ installed.push(a.id); countDownload(a); addXP(20); } iver[a.id]=a.version; persist(); vib(40); }
function canUse(a){
  if(!a) return false;
  if(a.status&&a.status!=="published"){ toast("This app is not published yet"); return false; }
  if(a.price>0 && !installed.includes(a.id)){
    if(STORE.whatsapp) window.open(`https://wa.me/${encodeURIComponent(STORE.whatsapp)}?text=${encodeURIComponent(a.name+" - I want to buy this app ("+priceTxt(a)+")")}`,"_blank");
    else toast("This is a paid app. Contact the owner");
    return false;
  }
  return true;
}
function openWeb(){
  const a=cur; if(!canUse(a)) return;
  const l=safeUrl(a.link);
  if(l==="#"){ toast("The web version of this app is not available yet."); return; }
  markUsed(a); window.open(l,"_blank"); openApp(a.id); render();
}
function getApk(){
  const a=cur; if(!canUse(a)) return;
  const l=safeUrl(a.apk);
  if(l==="#"){ toast("The Android APK is not available yet. Please use the web app for now."); return; }
  if(/github\.com\/[^/]+\/[^/]+\/blob\//.test(l)){ toast("This is a GitHub page link, not the APK file. Use the Releases download link."); return; }
  markUsed(a); const x=document.createElement("a"); x.href=l; x.download=""; document.body.appendChild(x); x.click(); x.remove(); openApp(a.id); render();
}
function installApp(){ openWeb(); }
function uninstall(){ installed=installed.filter(x=>x!==cur.id); delete iver[cur.id]; persist(); toast("Removed"); openApp(cur.id); render(); }
function toggleWish(){ const add=!wish.includes(cur.id); wish=add?[...wish,cur.id]:wish.filter(x=>x!==cur.id); persist(); if(add) addXP(3); else toast("Removed"); openApp(cur.id); render(); }

/* ---- Ratings and reviews ---- */
async function saveMyReview(stars,text){
  if(!user){ toast("Please log in first"); return; }
  if(!window.cloud){ toast("No internet, try again later"); return; }
  const id=cur.id;
  try{
    const ex=await window.cloud.getMyReview(id,user.uid);
    const rev={appId:id,uid:user.uid,name:String(user.name||"User").slice(0,40),photo:String(user.photo||"").slice(0,500),stars,text:String(text!==undefined?text:(ex?ex.text:"")).slice(0,300),ts:Date.now()};
    await window.cloud.saveReview(rev);
    const dS=stars-(ex?ex.stars:0), dC=ex?0:1;
    await window.cloud.bump(id,0,dS,dC).catch(()=>{});
    const s=cstats[id]=cstats[id]||{downloads:0,ratingSum:0,ratingCount:0};
    s.ratingSum+=dS; s.ratingCount+=dC;
    mine[id]=rev; delete drafts[id];
    creviews[id]=(creviews[id]||[]).filter(r=>r.uid!==user.uid).concat([rev]);
    if(!ex) addXP(15); else toast("✅ Saved");
    paintMine(id); paintReviews(id);
  }catch(e){ console.warn(e); toast("❌ Could not save, try again"); }
}
async function delReview(appId,uid){
  if(!confirm("Delete this review?")) return;
  const r=(creviews[appId]||[]).find(x=>x.uid===uid);
  try{
    await window.cloud.delReview(appId,uid);
    if(r){ await window.cloud.bump(appId,0,-r.stars,-1).catch(()=>{}); const s=cstats[appId]; if(s){ s.ratingSum-=r.stars; s.ratingCount-=1; } }
    creviews[appId]=(creviews[appId]||[]).filter(x=>x.uid!==uid); paintReviews(appId); toast("🗑️ Deleted");
  }catch(e){ toast("❌ Could not delete"); }
}
function rate(n){
  if(CLOUD) return saveMyReview(n,undefined);
  const first=!myRate[cur.id]; myRate[cur.id]=n; ls.set("rates",myRate);
  if(first) addXP(5); else toast("⭐ Thanks!");
  openApp(cur.id);
}
function addReview(){
  if(CLOUD){ const t=$("#rt"); return saveMyReview((mine[cur.id]&&mine[cur.id].stars)||5, t?t.value.trim():""); }
  const name=($("#rn").value.trim()||"Anonymous").slice(0,30), text=$("#rt").value.trim().slice(0,300);
  if(!text){ toast("Write something first"); return; }
  (myRev[cur.id]=myRev[cur.id]||[]).push({name,text,stars:myRate[cur.id]||5});
  ls.set("reviews",myRev); addXP(15); openApp(cur.id);
}
async function reportApp(){
  if(!user){ toast("Log in to report"); return; }
  const reason=prompt("What is wrong? (for example: fake, virus, does not work)");
  if(!reason||!reason.trim()) return;
  try{ await window.cloud.addReport({appId:cur.id,uid:user.uid,reason:reason.trim().slice(0,200),ts:Date.now()}); toast("🚩 Report sent, thank you!"); }
  catch(e){ toast("❌ Could not send"); }
}
function shareApp(){
  const d={title:cur.name,text:cur.name+" - "+cur.desc,url:location.href};
  if(navigator.share) navigator.share(d).catch(()=>{});
  else navigator.clipboard.writeText(location.href).then(()=>toast("🔗 Link copied"));
}

  const st=IMGV("store"); if(st) ["icon","apple-touch-icon"].forEach(r=>{ const l=document.createElement("link"); l.rel=r; l.href=st; document.head.appendChild(l); }); }
render();

<script type="module">
if (STORE.firebase && STORE.firebase.projectId) {
  try {
    const B = "https://www.gstatic.com/firebasejs/10.14.1/";
    const { initializeApp } = await import(B + "firebase-app.js");
    const A = await import(B + "firebase-auth.js");
    const F = await import(B + "firebase-firestore.js");
    const app = initializeApp(STORE.firebase);
    const auth = A.getAuth(app), db = F.getFirestore(app);
    const col = n => F.collection(db, n), dc = (n, i) => F.doc(db, n, i);
    const rows = s => { const l = []; s.forEach(d => l.push({ ...d.data(), _id: d.id })); return l; };
    const clean = o => JSON.parse(JSON.stringify(o));
    window.cloud = {
      onUser(cb) {
        A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, name: u.displayName || "User", email: u.email || "", photo: u.photoURL || "" } : null));
      },
      async login() {
        const p = new A.GoogleAuthProvider();
        try { await A.signInWithPopup(auth, p); }
        catch (e) {
          if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await A.signInWithRedirect(auth, p);
          else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") throw e;
        }
      },
      logout() { return A.signOut(auth); },
      async getApps(mode, uid) {
        const q = mode === "public" ? F.query(col("apps"), F.where("status", "==", "published"))
          : mode === "mine" ? F.query(col("apps"), F.where("ownerUid", "==", uid)) : col("apps");
        return rows(await F.getDocs(q)).map(a => ({ ...a, id: a._id }));
      },
      saveApp(a) { const { _id, ...rest } = a; return F.setDoc(dc("apps", a.id), clean(rest)); },
      delApp(id) { return F.deleteDoc(dc("apps", id)); },
      async importApps(list) {
        const b = F.writeBatch(db);
        list.forEach(a => { const { _id, ...rest } = a; b.set(dc("apps", a.id), clean(rest)); });
        await b.commit();
      },
      async loadStats() { const o = {}; rows(await F.getDocs(col("stats"))).forEach(r => { o[r._id] = r; }); return o; },
      bump(id, d, s, c) {
        return F.setDoc(dc("stats", id), { downloads: F.increment(d), ratingSum: F.increment(s), ratingCount: F.increment(c) }, { merge: true });
      },
      async loadReviews(appId) {
        const l = rows(await F.getDocs(F.query(col("reviews"), F.where("appId", "==", appId))));
        return l.sort((a, b) => (a.ts || 0) - (b.ts || 0)).slice(-50);
      },
      async getMyReview(appId, uid) { const s = await F.getDoc(dc("reviews", appId + "_" + uid)); return s.exists() ? s.data() : null; },
      saveReview(r) { return F.setDoc(dc("reviews", r.appId + "_" + r.uid), clean(r)); },
      delReview(appId, uid) { return F.deleteDoc(dc("reviews", appId + "_" + uid)); },
      async getUser(uid) { const s = await F.getDoc(dc("users", uid)); return s.exists() ? s.data() : null; },
      saveUser(uid, d) { return F.setDoc(dc("users", uid), clean(d), { merge: true }); },
      addReport(r) { return F.addDoc(col("reports"), clean(r)); },
      async getReports() { return rows(await F.getDocs(col("reports"))).sort((a, b) => (b.ts || 0) - (a.ts || 0)); },
      delReport(id) { return F.deleteDoc(dc("reports", id)); },
      async countUsers() { return (await F.getCountFromServer(col("users"))).data().count; }
    };
    window.dispatchEvent(new Event("cloudready"));
  } catch (e) { console.warn("Firebase did not start:", e); }
}
</script>
