<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0a0f1c;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
canvas#c{position:fixed;inset:0;display:block}
.glass{background:rgba(10,16,32,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px}

#stars i{font-style:normal;opacity:.25}#stars i.on{opacity:1}#stars.flash{animation:fl .5s infinite}
@keyframes fl{50%{color:#4da3ff}}
.bar{width:112px;height:9px;border-radius:6px;background:#0007;overflow:hidden;border:1px solid #fff3}
.bar b{display:block;height:100%;background:#ff5a5a;width:100%}.bar.car b{background:#5ab0ff}.bar.nit b{background:#ffb02e}
#spd{font-size:26px;font-weight:800;text-shadow:0 2px 8px #000}#spd small{font-size:11px;opacity:.8;font-weight:600}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);resize();
const TAU=Math.PI*2,R0=Math.random;
const rr=(a,b)=>a+R0()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),pick=a=>a[Math.floor(R0()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrap=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function shade(h,f){const c=hx(h);return 'rgb('+(Math.min(255,c[0]*f)|0)+','+(Math.min(255,c[1]*f)|0)+','+(Math.min(255,c[2]*f)|0)+')'}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ===== world ===== */
const N=12,PER=650,RW=130,BS=PER-RW,WS=N*PER+RW,SW=24;
const PAL=['#c9b6a0','#9fb3c8','#b9a2a2','#a5b8a0','#d0c58f','#8e9aaf','#c3a6c9','#8fc1c0','#d9a76a','#b7b7bd'];
const blocks=[];
const SPEC={garage:[6,6],police:[3,8],hospital:[9,3]};
const GARAGE={x:6*PER+RW+BS/2,y:6*PER+RW+16};
const POLICE={x:3*PER+RW+BS/2,y:8*PER+RW+16};
const HOSP={x:9*PER+RW+BS/2,y:3*PER+RW+16};
(function gen(){
 const g=mul(2077);const gr=(a,b)=>a+g()*(b-a);
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x0=i*PER+RW,y0=j*PER+RW;let r=g();
  let type=r<.11?'park':r<.2?'tower':r<.26?'lot':r<.29?'plaza':'bld';
  const sp=Object.keys(SPEC).find(k=>SPEC[k][0]===i&&SPEC[k][1]===j);
  if(sp)type='bld';
  const bl={i,j,x:x0,y:y0,type,b:[],trees:[],car:[]};
  const IN=BS-2*SW;
  if(type==='bld'){
   const lw=(IN-12)/2;
   for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    const w=lw-gr(0,36),h=lw-gr(0,36);
    const c=PAL[Math.floor(g()*PAL.length)];
    bl.b.push({x:x0+SW+a*(lw+12)+gr(0,lw-w),y:y0+SW+b*(lw+12)+gr(0,lw-h),w,h,z:gr(70,230),c,cs:c,sp:''});
   }
   if(sp){bl.b[0].sp=sp;bl.b[0].z=90;bl.b[0].c=sp==='garage'?'#7c8aa0':sp==='police'?'#6a86c8':'#e8e8ee'}
  }else if(type==='tower'){
   const c=PAL[Math.floor(g()*PAL.length)];
   bl.b.push({x:x0+SW+34,y:y0+SW+34,w:IN-68,h:IN-68,z:gr(320,480),c,sp:''});
  }else if(type==='park'||type==='plaza'){
   for(let k=0;k<(type==='park'?22:8);k++)bl.trees.push({x:x0+SW+gr(14,IN-14),y:y0+SW+gr(14,IN-14),r:gr(11,21),c:g()<.2?'#2f7d3b':'#3e9a4c'});
  }else if(type==='lot'){
   for(let k=0;k<12;k++)bl.car.push({x:x0+SW+18+(k%6)*74,y:y0+SW+22+Math.floor(k/6)*180,c:g()<.6?pick(['#d9382f','#2f7fd9','#e5e5e5','#222','#d8b13a']):null});
  }
  for(const b of bl.b){b.cs=shade(b.c,.62);b.cr=b.c;b.cd=shade(b.c,.8)}
  blocks.push(bl);
 }
})();
const blk=(i,j)=>blocks[i*N+j];
function blocksNear(x,y,r,fn){
 const i0=Math.floor((x-r)/PER),i1=Math.floor((x+r)/PER),j0=Math.floor((y-r)/PER),j1=Math.floor((y+r)/PER);
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++)if(i>=0&&i<N&&j>=0&&j<N)fn(blocks[i*N+j]);
}
function circleRect(x,y,r,b){
 const nx=clamp(x,b.x,b.x+b.w),ny=clamp(y,b.y,b.y+b.h),dx=x-nx,dy=y-ny,d2=dx*dx+dy*dy;
 if(d2>=r*r)return null;
 if(d2<1e-6){const l=x-b.x,rt=b.x+b.w-x,t=y-b.y,bt=b.y+b.h-y,m=Math.min(l,rt,t,bt);
  if(m===l)return[-1,0,l+r];if(m===rt)return[1,0,rt+r];if(m===t)return[0,-1,t+r];return[0,1,bt+r]}
 const d=Math.sqrt(d2);return[dx/d,dy/d,r-d];
}
function inBuilding(x,y,pad){let hit=false;
 const i=Math.floor(x/PER),j=Math.floor(y/PER);
 if(i<0||j<0||i>=N||j>=N)return false;
 for(const b of blocks[i*N+j].b){if(x>b.x-pad&&x<b.x+b.w+pad&&y>b.y-pad&&y<b.y+b.h+pad){hit=true;break}}
 return hit;
}
function los(x1,y1,x2,y2){
 const d=dist(x1,y1,x2,y2),n=Math.ceil(d/45);
 for(let k=1;k<n;k++){const t=k/n;if(inBuilding(x1+(x2-x1)*t,y1+(y2-y1)*t,14))return false}
 return true;
}
const lanePos=(i,s)=>i*PER+RW*(s?.73:.27);
const nodeXY=(i,j)=>[i*PER+RW/2,j*PER+RW/2];
const DX=[1,0,-1,0],DY=[0,1,0,-1];
// roads: vertical road index k at x in [k*PER,k*PER+RW]
function onGrass(x,y){const i=Math.floor(x/PER),j=Math.floor(y/PER);if(i<0||j<0||i>=N||j>=N)return false;
 const bl=blocks[i*N+j];if(bl.type!=='park')return false;return x>bl.x+SW&&x<bl.x+BS-SW&&y>bl.y+SW&&y<bl.y+BS-SW}

/* ===== models ===== */
const MODELS=[
 {id:'desi100',name:'Desi 100',price:0,L:46,Wd:20,acc:330,top:340,turn:3.1,grip:5.2,hp:70,mass:.5,bike:1},
 {id:'thunder150',name:'Thunder 150',price:1500,L:48,Wd:20,acc:400,top:420,turn:3.0,grip:5.4,hp:75,mass:.55,bike:1},
 {id:'cruiser350',name:'Cruiser 350',price:3500,L:54,Wd:22,acc:380,top:440,turn:2.6,grip:4.9,hp:110,mass:.8,bike:1},
 {id:'apex200',name:'Apex 200',price:7000,L:48,Wd:20,acc:500,top:520,turn:3.1,grip:5.6,hp:80,mass:.55,bike:1},
 {id:'storm650',name:'Storm 650',price:14000,L:52,Wd:21,acc:600,top:620,turn:2.9,grip:5.8,hp:90,mass:.65,bike:1},
 {id:'hyper1000',name:'Hyper 1000',price:30000,L:54,Wd:21,acc:740,top:740,turn:3.0,grip:6.1,hp:95,mass:.7,bike:1}
];
const TRAF=[
 {k:'auto',L:52,Wd:28,acc:300,top:200,turn:2.5,grip:5,hp:90,mass:.9,w:26,cols:['#f2c500','#1f9d55','#f2c500']},
 {k:'car',L:70,Wd:34,acc:340,top:300,turn:2.5,grip:5,hp:120,mass:1.2,w:30,cols:['#c0392b','#2980b9','#ecf0f1','#34495e','#7f8c8d','#d35400','#16a085']},
 {k:'bike',L:46,Wd:20,acc:330,top:300,turn:3,grip:5,hp:60,mass:.5,w:20,bike:1,cols:['#222','#c0392b','#2c3e50','#1f77b4']},
 {k:'bus',L:128,Wd:42,acc:200,top:200,turn:1.8,grip:4.5,hp:300,mass:3.2,w:9,cols:['#d62828','#1d4ed8','#e76f00']},
 {k:'truck',L:116,Wd:42,acc:200,top:190,turn:1.8,grip:4.5,hp:280,mass:3,w:9,cols:['#f77f00','#2a9d8f','#9b2226','#264653']},
 {k:'cow',L:44,Wd:18,acc:100,top:10,turn:1,grip:5,hp:200,mass:3,w:4,cols:['#f1ece0','#b9855a','#2b2b2b']},
 {k:'suv',L:78,Wd:38,acc:320,top:300,turn:2.2,grip:4.8,hp:200,mass:1.7,w:6,cols:['#ecf0f1','#2c3e50','#7f8c8d']}
];
const COPM={id:'cop',name:'Police',L:74,Wd:34,acc:380,top:420,turn:2.6,grip:5.2,hp:130,mass:1.3};
const CARCOLS=['#e8b04a','#d9382f','#2f7fd9','#2fb36b','#8e44ad','#f2f2f2','#222a35','#ff7a1a'];

/* ===== audio ===== */
const A={c:null,rad:0,step:0,next:0,on:true};
const ST=[{n:'Lo-Fi 88.1',bpm:80},{n:'Synthwave 101.5',bpm:112},{n:'Rock 96.7',bpm:130},{n:'Radio off',bpm:0}];
const mf=m=>440*Math.pow(2,(m-69)/12);
function aInit(){
 if(A.c)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;A.c=new C();
  A.m=A.c.createGain();A.m.gain.value=A.on?.8:0;A.m.connect(A.c.destination);
  A.rg=A.c.createGain();A.rg.gain.value=0;A.rg.connect(A.m);
  A.sg=A.c.createGain();A.sg.gain.value=.6;A.sg.connect(A.m);
  const b=A.c.createBuffer(1,A.c.sampleRate,A.c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.nb=b;
  A.eo=A.c.createOscillator();A.eo.type='sawtooth';A.eg=A.c.createGain();A.eg.gain.value=0;A.ef=A.c.createBiquadFilter();A.ef.type='lowpass';A.ef.frequency.value=420;
  A.eo.connect(A.ef);A.ef.connect(A.eg);A.eg.connect(A.sg);A.eo.start();
  A.so=A.c.createOscillator();A.so.type='square';A.sgn=A.c.createGain();A.sgn.gain.value=0;A.so.connect(A.sgn);A.sgn.connect(A.sg);A.so.start();
  A.next=A.c.currentTime+.1;
  setInterval(seq,30);
 }catch(e){A.c=null}
}
function tone(f,t,d,type,v,dst){const o=A.c.createOscillator(),g=A.c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst||A.rg);o.start(t);o.stop(t+d+.05)}

 {const rx=pl.x-c.x,ry=pl.y-c.y;const f=rx*dx+ry*dy;if(!pl.car&&f>0&&f<110&&Math.abs(rx*dy-ry*dx)<30)sp=Math.min(sp,Math.max(0,(f-50)*2))}

function copAI(c,dt){
 let tx=pl.x,ty=pl.y;const tc=pl.car;if(tc){tx+=tc.vx*.4;ty+=tc.vy*.4}
 c.los=(c.los||0)-dt;
 if(c.los<=0){c.los=.25;c.clear=los(c.x,c.y,tx,ty)}
 if(!c.clear){
  const ci=clamp(Math.round((c.x-RW/2)/PER),0,N),cj=clamp(Math.round((c.y-RW/2)/PER),0,N);
  const ti=clamp(Math.round((tx-RW/2)/PER),0,N),tj=clamp(Math.round((ty-RW/2)/PER),0,N);
  let ni=ci,nj=cj;
  const nc=nodeXY(ci,cj);const nearNode=dist(c.x,c.y,nc[0],nc[1])<130;
  if(ci!==ti||cj!==tj){
   // move along the road we are on, toward the target's row/col
   const onVert=Math.abs(c.x-nc[0])<RW*.7,onHorz=Math.abs(c.y-nc[1])<RW*.7;
   if(cj!==tj&&(onVert||(!onHorz))){nj=cj+Math.sign(tj-cj)}
   else if(ci!==ti){ni=ci+Math.sign(ti-ci)}
   else nj=cj+Math.sign(tj-cj);
   if(nearNode&&c.pathTurn!==ci+','+cj){c.pathTurn=ci+','+cj;if(ci!==ti&&(cj===tj||R0()<.5)){ni=ci+Math.sign(ti-ci);nj=cj}else if(cj!==tj){nj=cj+Math.sign(tj-cj);ni=ci}}
  }
  const np=nodeXY(ni,nj);tx=np[0];ty=np[1];
 }
 const ta=Math.atan2(ty-c.y,tx-c.x),diff=wrap(ta-c.a);
 let thr=1,steer=clamp(diff*2.4,-1,1);
 const sp=Math.hypot(c.vx,c.vy);
 if(sp<22)c.stuck+=dt;else c.stuck=Math.max(0,c.stuck-dt);
 if(c.stuck>1.1){c.rev=.9;c.stuck=0}
 if(c.rev>0){c.rev-=dt;thr=-1;steer=-steer}
 else if(Math.abs(diff)>1.9&&sp>60){thr=-.3}
 const d=dist(c.x,c.y,pl.x,pl.y);
 if(c.wreck||c.hp<=0){thr=0}
 return[thr,steer,d];
}
function updCops(dt){
