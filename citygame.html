<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0a0f1c;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
canvas#c{position:fixed;inset:0;display:block}

#toast small{display:block;font-size:.4em;font-weight:600;opacity:.9;letter-spacing:0;margin-top:4px}

#sub.on{opacity:1}
#ov{position:fixed;inset:0;display:none;z-index:20;pointer-events:none}
#ov.wasted{display:block;background:radial-gradient(#0000,#000b);backdrop-filter:grayscale(1) contrast(1.1);-webkit-backdrop-filter:grayscale(1)}

#jk{position:absolute;left:34px;top:34px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid #fff9}
.b{position:fixed;z-index:8;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(20,30,60,.55);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.b:active,.b.dn{background:rgba(80,140,255,.75);transform:scale(.94)}
#bAct{right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:82px;height:82px;font-size:14px;background:rgba(40,160,90,.6)}

#bNit{right:max(18px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 92px);width:60px;height:60px;background:rgba(200,120,20,.55)}

.tb{position:fixed;z-index:9;width:44px;height:44px;border-radius:12px;font-size:20px}
#bMenu{right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 138px)}
#bMap{right:calc(max(10px,env(safe-area-inset-right)) + 52px);top:calc(max(10px,env(safe-area-inset-top)) + 138px)}

.btn{display:block;width:100%;margin:8px 0;padding:13px;border:0;border-radius:13px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6);cursor:pointer}
.btn.g{background:linear-gradient(135deg,#16a34a,#0d9488)}.btn.r{background:linear-gradient(135deg,#dc2626,#be185d)}.btn.d{background:#ffffff1a;font-weight:600}

.row{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:6px 0;border-radius:12px;background:#ffffff0f;font-size:13px}

.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.sw i{width:30px;height:30px;border-radius:50%;border:3px solid #fff3}.sw i.s{border-color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:8px;border:0;border-radius:10px;background:#ffffff14;color:#fff;font-weight:700}.tabs button.s{background:#3b82f6}
#fm{width:100%;border-radius:12px;display:block;background:#0d1b2a}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}.kv div{background:#ffffff0f;padding:7px 9px;border-radius:9px}.kv b{display:block;font-size:15px}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);resize();
const TAU=Math.PI*2,R0=Math.random;
const rr=(a,b)=>a+R0()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),pick=a=>a[Math.floor(R0()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrap=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function shade(h,f){const c=hx(h);return 'rgb('+(Math.min(255,c[0]*f)|0)+','+(Math.min(255,c[1]*f)|0)+','+(Math.min(255,c[2]*f)|0)+')'}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ===== world ===== */
const N=12,PER=650,RW=130,BS=PER-RW,WS=N*PER+RW,SW=24;
const PAL=['#c9b6a0','#9fb3c8','#b9a2a2','#a5b8a0','#d0c58f','#8e9aaf','#c3a6c9','#8fc1c0','#d9a76a','#b7b7bd'];
const blocks=[];
const SPEC={garage:[6,6],police:[3,8],hospital:[9,3]};
const GARAGE={x:6*PER+RW+BS/2,y:6*PER+RW+16};
const POLICE={x:3*PER+RW+BS/2,y:8*PER+RW+16};
const HOSP={x:9*PER+RW+BS/2,y:3*PER+RW+16};
(function gen(){
 const g=mul(2077);const gr=(a,b)=>a+g()*(b-a);
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x0=i*PER+RW,y0=j*PER+RW;let r=g();
  let type=r<.11?'park':r<.2?'tower':r<.26?'lot':r<.29?'plaza':'bld';
  const sp=Object.keys(SPEC).find(k=>SPEC[k][0]===i&&SPEC[k][1]===j);
  if(sp)type='bld';
  const bl={i,j,x:x0,y:y0,type,b:[],trees:[],car:[]};
  const IN=BS-2*SW;
  if(type==='bld'){
   const lw=(IN-12)/2;
   for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    const w=lw-gr(0,36),h=lw-gr(0,36);
    const c=PAL[Math.floor(g()*PAL.length)];
    bl.b.push({x:x0+SW+a*(lw+12)+gr(0,lw-w),y:y0+SW+b*(lw+12)+gr(0,lw-h),w,h,z:gr(70,230),c,cs:c,sp:''});
   }
   if(sp){bl.b[0].sp=sp;bl.b[0].z=90;bl.b[0].c=sp==='garage'?'#7c8aa0':sp==='police'?'#6a86c8':'#e8e8ee'}
  }else if(type==='tower'){
   const c=PAL[Math.floor(g()*PAL.length)];
   bl.b.push({x:x0+SW+34,y:y0+SW+34,w:IN-68,h:IN-68,z:gr(320,480),c,sp:''});
  }else if(type==='park'||type==='plaza'){
   for(let k=0;k<(type==='park'?22:8);k++)bl.trees.push({x:x0+SW+gr(14,IN-14),y:y0+SW+gr(14,IN-14),r:gr(11,21),c:g()<.2?'#2f7d3b':'#3e9a4c'});
  }else if(type==='lot'){
   for(let k=0;k<12;k++)bl.car.push({x:x0+SW+18+(k%6)*74,y:y0+SW+22+Math.floor(k/6)*180,c:g()<.6?pick(['#d9382f','#2f7fd9','#e5e5e5','#222','#d8b13a']):null});
  }
  for(const b of bl.b){b.cs=shade(b.c,.62);b.cr=b.c;b.cd=shade(b.c,.8)}
  blocks.push(bl);
 }
})();
const blk=(i,j)=>blocks[i*N+j];
function blocksNear(x,y,r,fn){
 const i0=Math.floor((x-r)/PER),i1=Math.floor((x+r)/PER),j0=Math.floor((y-r)/PER),j1=Math.floor((y+r)/PER);
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++)if(i>=0&&i<N&&j>=0&&j<N)fn(blocks[i*N+j]);
}
function circleRect(x,y,r,b){
 const nx=clamp(x,b.x,b.x+b.w),ny=clamp(y,b.y,b.y+b.h),dx=x-nx,dy=y-ny,d2=dx*dx+dy*dy;
 if(d2>=r*r)return null;
 if(d2<1e-6){const l=x-b.x,rt=b.x+b.w-x,t=y-b.y,bt=b.y+b.h-y,m=Math.min(l,rt,t,bt);
  if(m===l)return[-1,0,l+r];if(m===rt)return[1,0,rt+r];if(m===t)return[0,-1,t+r];return[0,1,bt+r]}
 const d=Math.sqrt(d2);return[dx/d,dy/d,r-d];
}
function inBuilding(x,y,pad){let hit=false;
 const i=Math.floor(x/PER),j=Math.floor(y/PER);
 if(i<0||j<0||i>=N||j>=N)return false;
 for(const b of blocks[i*N+j].b){if(x>b.x-pad&&x<b.x+b.w+pad&&y>b.y-pad&&y<b.y+b.h+pad){hit=true;break}}
 return hit;
}
function los(x1,y1,x2,y2){
 const d=dist(x1,y1,x2,y2),n=Math.ceil(d/45);
 for(let k=1;k<n;k++){const t=k/n;if(inBuilding(x1+(x2-x1)*t,y1+(y2-y1)*t,14))return false}
 return true;
}
const lanePos=(i,s)=>i*PER+RW*(s?.73:.27);
const nodeXY=(i,j)=>[i*PER+RW/2,j*PER+RW/2];
const DX=[1,0,-1,0],DY=[0,1,0,-1];
// roads: vertical road index k at x in [k*PER,k*PER+RW]
function onGrass(x,y){const i=Math.floor(x/PER),j=Math.floor(y/PER);if(i<0||j<0||i>=N||j>=N)return false;
 const bl=blocks[i*N+j];if(bl.type!=='park')return false;return x>bl.x+SW&&x<bl.x+BS-SW&&y>bl.y+SW&&y<bl.y+BS-SW}

/* ===== models ===== */
const MODELS=[
 {id:'compact',name:'Rio Compact',price:0,L:64,Wd:32,acc:300,top:370,turn:2.7,grip:5.4,hp:100,mass:1},
 {id:'sedan',name:'Metro Sedan',price:1500,L:74,Wd:34,acc:340,top:420,turn:2.5,grip:5.2,hp:130,mass:1.2},
 {id:'suv',name:'Titan SUV',price:3200,L:78,Wd:38,acc:330,top:410,turn:2.25,grip:4.9,hp:210,mass:1.7},
 {id:'muscle',name:'Bolt Muscle',price:6000,L:82,Wd:36,acc:470,top:510,turn:2.4,grip:4.3,hp:150,mass:1.4},
 {id:'sport',name:'Apex Sport',price:12000,L:76,Wd:34,acc:540,top:590,turn:2.75,grip:5.6,hp:125,mass:1.1},
 {id:'super',name:'Nova Hypercar',price:30000,L:82,Wd:34,acc:660,top:710,turn:2.85,grip:5.9,hp:135,mass:1.1}
];
const COPM={id:'cop',name:'Police',L:74,Wd:34,acc:380,top:420,turn:2.6,grip:5.2,hp:130,mass:1.3};
const CARCOLS=['#e8b04a','#d9382f','#2f7fd9','#2fb36b','#8e44ad','#f2f2f2','#222a35','#ff7a1a'];

/* ===== audio ===== */
const A={c:null,rad:0,step:0,next:0,on:true};
const ST=[{n:'Lo-Fi 88.1',bpm:80},{n:'Synthwave 101.5',bpm:112},{n:'Rock 96.7',bpm:130},{n:'Radio off',bpm:0}];
const mf=m=>440*Math.pow(2,(m-69)/12);
function aInit(){
 if(A.c)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;A.c=new C();
  A.m=A.c.createGain();A.m.gain.value=A.on?.8:0;A.m.connect(A.c.destination);
  A.rg=A.c.createGain();A.rg.gain.value=0;A.rg.connect(A.m);
  A.sg=A.c.createGain();A.sg.gain.value=.6;A.sg.connect(A.m);
  const b=A.c.createBuffer(1,A.c.sampleRate,A.c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.nb=b;
  A.eo=A.c.createOscillator();A.eo.type='sawtooth';A.eg=A.c.createGain();A.eg.gain.value=0;A.ef=A.c.createBiquadFilter();A.ef.type='lowpass';A.ef.frequency.value=420;
  A.eo.connect(A.ef);A.ef.connect(A.eg);A.eg.connect(A.sg);A.eo.start();
  A.so=A.c.createOscillator();A.so.type='square';A.sgn=A.c.createGain();A.sgn.gain.value=0;A.so.connect(A.sgn);A.sgn.connect(A.sg);A.so.start();
  A.next=A.c.currentTime+.1;
  setInterval(seq,30);
 }catch(e){A.c=null}
}
function tone(f,t,d,type,v,dst){const o=A.c.createOscillator(),g=A.c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst||A.rg);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,ft,fh,dst){const s=A.c.createBufferSource();s.buffer=A.nb;const f=A.c.createBiquadFilter();f.type=ft;f.frequency.value=fh;const g=A.c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dst||A.rg);s.start(t);s.stop(t+d+.05)}
function kick(t){const o=A.c.createOscillator(),g=A.c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(A.rg);o.start(t);o.stop(t+.22)}
const PROG=[[57,53,48,55],[45,41,48,43],[40,36,43,38]];
function seq(){
 if(!A.c||A.rad>2||!A.c)return;
 const st=ST[A.rad],sd=60/st.bpm/4,now=A.c.currentTime;
 if(A.next<now-.5)A.next=now+.05;
 while(A.next<now+.16){beat(A.rad,A.step,A.next,sd);A.next+=sd;A.step++}
}
function beat(r,step,t,sd){
 const bar=Math.floor(step/16)%4,s=step%16,root=PROG[r][bar];
 if(r===0){
  if(s===0||s===10)kick(t);if(s===4||s===12)noise(t,.14,.35,'bandpass',1800);if(s%2===0)noise(t,.04,.12,'highpass',7000);
  if(s===0){[0,3,7,10].forEach(k=>tone(mf(root+12+k),t,sd*15,'triangle',.07))}
  if(s===0||s===6||s===11)tone(mf(root),t,sd*3,'sine',.3);
  if(s===2||s===7||s===14)tone(mf(root+24+[0,3,7,10][(s>>1)%4]),t,sd*2,'triangle',.06);
 }else if(r===1){
  if(s%4===0)kick(t);if(s%4===2)noise(t,.05,.16,'highpass',8000);if(s===4||s===12)noise(t,.12,.3,'bandpass',2200);
  if(s%2===0)tone(mf(root),t,sd*1.6,'sawtooth',.14);
  tone(mf(root+24+[0,7,12,7][s%4]+(bar%2?3:0)),t,sd*.9,'square',.05);
  if(s===0)[0,4,7].forEach(k=>tone(mf(root+24+k),t,sd*14,'sawtooth',.03));
 }else{
  if(s===0||s===6||s===8||s===14)kick(t);if(s===4||s===12)noise(t,.16,.45,'bandpass',2000);if(s%2===0)noise(t,.04,.14,'highpass',7500);

function spawnCop(){
 const a=rr(0,TAU),d=rr(800,1200);const rp=nearestRoadPoint(pl.x+Math.cos(a)*d,pl.y+Math.sin(a)*d);
 if(dist(rp.x,rp.y,pl.x,pl.y)<600)return;
 const c=mkCar(Object.assign({},COPM,{top:380+stars()*40,acc:380+stars()*30}),rp.x,rp.y,rp.a,'#f2f4f8','cop');c.free=true;c.sir=R0();c.wp=0;R.cars.push(c);
}
function copAI(c,dt){
 let tx=pl.x,ty=pl.y;const tc=pl.car;if(tc){tx+=tc.vx*.4;ty+=tc.vy*.4}
 c.los=(c.los||0)-dt;
 if(c.los<=0){c.los=.25;c.clear=los(c.x,c.y,tx,ty)}
 if(!c.clear){
  const ci=clamp(Math.round((c.x-RW/2)/PER),0,N),cj=clamp(Math.round((c.y-RW/2)/PER),0,N);
  const ti=clamp(Math.round((tx-RW/2)/PER),0,N),tj=clamp(Math.round((ty-RW/2)/PER),0,N);
  let ni=ci,nj=cj;
  const nc=nodeXY(ci,cj);const nearNode=dist(c.x,c.y,nc[0],nc[1])<130;
  if(ci!==ti||cj!==tj){
   // move along the road we are on, toward the target's row/col
   const onVert=Math.abs(c.x-nc[0])<RW*.7,onHorz=Math.abs(c.y-nc[1])<RW*.7;
   if(cj!==tj&&(onVert||(!onHorz))){nj=cj+Math.sign(tj-cj)}
   else if(ci!==ti){ni=ci+Math.sign(ti-ci)}
   else nj=cj+Math.sign(tj-cj);
   if(nearNode&&c.pathTurn!==ci+','+cj){c.pathTurn=ci+','+cj;if(ci!==ti&&(cj===tj||R0()<.5)){ni=ci+Math.sign(ti-ci);nj=cj}else if(cj!==tj){nj=cj+Math.sign(tj-cj);ni=ci}}
  }
  const np=nodeXY(ni,nj);tx=np[0];ty=np[1];
 }
 const ta=Math.atan2(ty-c.y,tx-c.x),diff=wrap(ta-c.a);
 let thr=1,steer=clamp(diff*2.4,-1,1);
 const sp=Math.hypot(c.vx,c.vy);
 if(sp<22)c.stuck+=dt;else c.stuck=Math.max(0,c.stuck-dt);
 if(c.stuck>1.1){c.rev=.9;c.stuck=0}
 if(c.rev>0){c.rev-=dt;thr=-1;steer=-steer}
 else if(Math.abs(diff)>1.9&&sp>60){thr=-.3}
 const d=dist(c.x,c.y,pl.x,pl.y);
 if(c.wreck||c.hp<=0){thr=0}
 return[thr,steer,d];
}
function updCops(dt){
 const st=stars(),want=[0,1,2,3,4,6][st];let n=0;
 for(const c of R.cars)if(c.kind==='cop'&&!c.wreck)n++;
 R.cops=n;R.copT-=dt;
 if(n<want&&R.copT<=0){spawnCop();R.copT=st>=4?1.2:2.4}
 let seen=false;
 for(const c of R.cars){if(c.kind!=='cop')continue;
  if(c.wreck){c.fire=1;continue}
  const[thr,steer,d]=copAI(c,dt);
  if(st===0){c.fade=Math.max(0,c.fade-dt*.15)}
  physCar(c,dt,st>0?thr:.5,st>0?steer:0,0,0);
  const imp=wallCollide(c);if(imp>0)hurtCar(c,imp*.8);
  if(d<520&&(c.clear||d<260))seen=true;
  c.sir+=dt;
 }
 if(st>0){
  if(seen)R.lastSeen=0;else R.lastSeen+=dt;
  if(R.lastSeen>4){R.heat-=5*dt;if(stars()===0){R.heat=0;toast('Wanted level lost','You got away!');sfxWin()}}
  // busted check
  let near=false;const sp=pl.car?Math.hypot(pl.car.vx,pl.car.vy):0;
  for(const c of R.cars){if(c.kind==='cop'&&!c.wreck&&dist(c.x,c.y,pl.x,pl.y)<(pl.car?95:75)&&(sp<90))near=true}
  R.bust=near?R.bust+dt:Math.max(0,R.bust-dt*1.5);
  if(R.bust>2.2)doBusted();
 }else{R.bust=0;R.cars=R.cars.filter(c=>c.kind!=='cop'||c.fade>.02||dist(c.x,c.y,pl.x,pl.y)<700)}
}

 if(t){const sx=(t.x-cx)*z+W/2,sy=(t.y-cy)*z+H/2;
  if(sx<30||sx>W-30||sy<80||sy>H-30){const dx=sx-W/2,dy=sy-H/2,a=Math.atan2(dy,dx);
   const ex=clamp(W/2+Math.cos(a)*W,36,W-36),ey=clamp(H/2+Math.sin(a)*H,90,H-36);
   // intersect with edge along ray
   const k2=Math.min((W/2-36)/Math.max(1e-3,Math.abs(Math.cos(a))),(H/2-70)/Math.max(1e-3,Math.abs(Math.sin(a))));
   const px=W/2+Math.cos(a)*k2,py=H/2+Math.sin(a)*k2;
   ctx.save();ctx.translate(px,py);ctx.rotate(a);ctx.fillStyle=R.M?'#ffd23f':'#ff4fd8';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-12);ctx.lineTo(-4,0);ctx.lineTo(-10,12);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore()}}
}

/* ===== UI ===== */
const panel=$('panel'),card=$('card');
function showPanel(h){card.innerHTML=h;panel.className='on'}
function hidePanel(){panel.className='';if(R.state==='pause')R.state='play'}
function pause(){if(R.state!=='play')return;R.state='pause';openPause()}
function openPause(){
 const m=myModel();
 showPanel('<h2>⏸ Menu</h2><div class="kv"><div>Money<b>$'+S.money+'</b></div><div>Rank<b>'+rank()+'</b></div><div>Jobs done<b>'+S.jobs+'</b></div><div>Car<b>'+m.name+'</b></div></div>'+
 '<button class="btn g" data-a="resume">▶ Resume</button><button class="btn" data-a="map">🗺 Full map (tap = GPS)</button><button class="btn d" data-a="call">🚗 Call my car ($100)</button>'+
 '<button class="btn d" data-a="gar">🔧 Garage / Shop (go to green G)</button>'+
 '<button class="btn d" data-a="snd">🔊 Sound: '+(A.on?'ON':'OFF')+'</button><button class="btn d" data-a="gas">⛽ Auto-gas (joystick): '+(R.autoGas?'ON':'OFF')+'</button><button class="btn d" data-a="low">🎛 Graphics: '+(R.low?'Low':'High')+'</button>'+
 (R.M?'<button class="btn r" data-a="cancel">✖ Cancel mission</button>':'')+
 '<button class="btn d" data-a="save">💾 Save game</button>');
}
function openMap(){
 R.state=R.state==='play'?'pause':R.state;
 showPanel('<h2>🗺 City map</h2><p>Tap anywhere to set a GPS marker (pink arrow). Green G = garage, blue = police, red = hospital, yellow = jobs.</p><canvas id="fm" width="640" height="640"></canvas><button class="btn g" data-a="resume">Close</button>');
 const f=$('fm'),fc=f.getContext('2d');
 fc.drawImage(mmBase,MP,MP,WS*MS,WS*MS,0,0,640,640);
 const k=640/WS,pt=(x,y,c,r)=>{fc.fillStyle=c;fc.beginPath();fc.arc(x*k,y*k,r,0,TAU);fc.fill();fc.strokeStyle='#000';fc.lineWidth=2;fc.stroke()};
 for(const g of R.givers)pt(g.x,g.y,'#ffd23f',7);if(R.wp)pt(R.wp.x,R.wp.y,'#ff4fd8',8);
 const t=R.M&&curTarget();if(t)pt(t.x,t.y,'#ffd23f',10);pt(pl.x,pl.y,'#ffffff',9);
 f.onclick=e=>{const r=f.getBoundingClientRect();R.wp={x:(e.clientX-r.left)/r.width*WS,y:(e.clientY-r.top)/r.height*WS};toast('GPS set','Follow the pink arrow');hidePanel()};
}
function cost(l){return Math.round(700*Math.pow(l+1,1.35))}
function openGarage(tab){
 tab=tab||'cars';R.state=R.state==='play'?'pause':R.state;
 let h='<h2>🔧 Nexus Garage</h2><div class="kv"><div>Money<b>$'+S.money+'</b></div><div>Rank<b>'+rank()+'</b></div></div><div class="tabs" style="margin-top:8px"><button data-t="cars" class="'+(tab==='cars'?'s':'')+'">Cars</button><button data-t="up" class="'+(tab==='up'?'s':'')+'">Upgrades</button><button data-t="paint" class="'+(tab==='paint'?'s':'')+'">Paint/Repair</button></div>';
 if(tab==='cars'){MODELS.forEach((m,i)=>{const own=S.owned.includes(i);h+='<div class="row"><div class="n"><b>'+m.name+'</b><span>Speed '+Math.round(m.top*.26)+' km/h · Grip '+m.grip.toFixed(1)+' · Armor '+m.hp+'</span></div>'+(S.model===i?'<button disabled>Selected</button>':own?'<button data-a="sel" data-i="'+i+'">Use</button>':'<button data-a="buy" data-i="'+i+'" '+(S.money<m.price?'disabled':'')+'>$'+m.price+'</button>')+'</div>'})}
 else if(tab==='up'){[['eng','Engine','More speed + acceleration'],['tire','Tires','Better grip, less slide'],['arm','Armor','Less crash damage']].forEach(u=>{const l=S.up[u[0]];h+='<div class="row"><div class="n"><b>'+u[1]+' Lv '+l+'/5</b><span>'+u[2]+'</span></div>'+(l>=5?'<button disabled>MAX</button>':'<button data-a="up" data-k="'+u[0]+'" '+(S.money<cost(l)?'disabled':'')+'>$'+cost(l)+'</button>')+'</div>'})}
 else{h+='<p>Car color:</p><div class="sw">'+CARCOLS.map((c,i)=>'<i data-a="col" data-i="'+i+'" style="background:'+c+'" class="'+(S.col===i?'s':'')+'"></i>').join('')+'</div><button class="btn" data-a="rep">🔩 Repair my car (free)</button>'}
 h+='<button class="btn g" data-a="resume">Done</button>';showPanel(h);
}
function swapCar(){
 let x=GARAGE.x+70,y=6*PER+RW*.73,a=0,in_=false;
 if(R.my){x=R.my.x;y=R.my.y;a=R.my.a;in_=pl.car===R.my;const i=R.cars.indexOf(R.my);if(i>=0)R.cars.splice(i,1)}
 const c=spawnMine(x,y,a);if(in_)pl.car=c;
}
card.addEventListener('click',e=>{
 const t=e.target.closest('[data-a],[data-t]');if(!t)return;aInit();
 if(t.dataset.t){openGarage(t.dataset.t);return}
 const a=t.dataset.a,i=+t.dataset.i;
 if(a==='resume'){hidePanel();R.state='play'}
 else if(a==='start'){startGame(false)}else if(a==='new'){startGame(true)}
 else if(a==='map')openMap();
 else if(a==='call'){hidePanel();R.state='play';callCar()}
 else if(a==='gar'){if(dist(pl.x,pl.y,GARAGE.x,GARAGE.y)<200)openGarage();else{toast('Too far','Drive to the green G first');hidePanel();R.state='play';R.wp={x:GARAGE.x,y:GARAGE.y}}}
 else if(a==='snd'){A.on=!A.on;if(A.m)A.m.gain.value=A.on?.8:0;openPause()}
 else if(a==='gas'){R.autoGas=!R.autoGas;openPause()}
 else if(a==='low'){R.low=!R.low;lightScale=R.low?.35:.5;openPause()}
 else if(a==='cancel'){failM('Cancelled');hidePanel();R.state='play'}
 else if(a==='save'){save();toast('Saved','')}
 else if(a==='buy'){const m=MODELS[i];if(S.money>=m.price){S.money-=m.price;S.owned.push(i);S.model=i;swapCar();sfxCash();openGarage('cars')}}
 else if(a==='sel'){S.model=i;swapCar();openGarage('cars')}
 else if(a==='up'){const k=t.dataset.k,l=S.up[k];if(l<5&&S.money>=cost(l)){S.money-=cost(l);S.up[k]++;sfxCash();openGarage('up')}}
 else if(a==='col'){S.col=i;if(R.my)R.my.col=CARCOLS[i];openGarage('paint')}
 else if(a==='rep'){if(R.my){R.my.hp=R.my.m.hp;R.my.wreck=0;R.my.fire=0}sfxCash();toast('Repaired','')}
 save();
});
function titleCard(){
 showPanel('<h1>NEXUS CITY</h1><p style="font-size:15px;opacity:1">Open-world city game · drive, explore, take jobs, escape the police.</p>'+
 '<button class="btn g" data-a="start">'+(hasSave?'▶ Continue':'▶ Play')+'</button>'+(hasSave?'<button class="btn d" data-a="new">New game</button>':'')+
 '<p><b>Controls</b><br>📱 Left thumb: joystick (in car: ← → steer, ↑ gas, ↓ brake/reverse). Right buttons: ENTER/EXIT car, DRIFT, NITRO, HORN (punch on foot).<br>⌨️ WASD/arrows · Space = drift · Shift = nitro · E = enter/exit · H = horn · R = radio · M = map · Esc = menu.</p>'+
 '<p>Walk to a yellow circle to start a job. Crashing or hitting people raises your wanted ★ level — hide to lose the police. Drive to the green G for the garage.</p>');
}
function startGame(fresh){
 aInit();
 if(fresh){S={money:600,xp:0,model:0,col:0,up:{eng:0,tire:0,arm:0},owned:[0],jobs:0,clock:17.3,hi:0,play:0}}
 R.cars=[];R.M=null;R.wp=null;R.heat=0;pl.car=null;pl.hp=100;
 const car=spawnMine(GARAGE.x+70,6*PER+RW*.73,0);
 pl.x=GARAGE.x+30;pl.y=GARAGE.y+10;pl.a=-Math.PI/2;R.cam.x=pl.x;R.cam.y=pl.y;
 for(let k=0;k<26;k++)spawnTraffic(pl.x,pl.y,450,1300);
 R.gcd=7;R.state='play';panel.className='';
 toast('Welcome to Nexus City','Walk to your car and press ENTER');save();
}
/* ===== input ===== */
const joy=$('joy'),jb=$('jb'),jk=$('jk');let jid=null,ox=0,oy=0;
function jmv(e){let dx=e.clientX-ox,dy=e.clientY-oy;const m=Math.hypot(dx,dy),mx=55;if(m>mx){dx=dx/m*mx;dy=dy/m*mx}
 const f=v=>Math.abs(v)<.12?0:v;R.jx=f(dx/mx);R.jy=f(dy/mx);jk.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{aInit();jid=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(_){}ox=e.clientX;oy=e.clientY;jb.style.display='block';jb.style.left=(ox-60)+'px';jb.style.top=(oy-60)+'px';R.joyOn=true;jmv(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmv(e)});
const jend=e=>{if(e.pointerId!==jid)return;jid=null;R.jx=R.jy=0;R.joyOn=false;jb.style.display='none';jk.style.transform=''};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function hold(id,fn){const el=$(id);el.addEventListener('pointerdown',e=>{aInit();e.preventDefault();el.classList.add('dn');fn(1)});const up=()=>{el.classList.remove('dn');fn(0)};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
hold('bHb',v=>R.hb=v);hold('bNit',v=>R.nit=v);
hold('bAct',v=>{if(v)doAct()});hold('bHorn',v=>{if(v)doHorn()});
$('bMenu').addEventListener('pointerdown',e=>{e.preventDefault();pause()});$('bMap').addEventListener('pointerdown',e=>{e.preventDefault();if(R.state==='play')openMap()});$('bRad').addEventListener('pointerdown',e=>{e.preventDefault();nextRadio()});
function doAct(){
 if(R.state!=='play')return;
 if(pl.car){if(Math.hypot(pl.car.vx,pl.car.vy)<280)exitCar();else toast('Too fast!','Slow down to get out')}
 else{const c=nearestCar(pl.x,pl.y,75);if(c)enterCar(c)}
}
function doHorn(){if(R.state!=='play')return;if(pl.car)sfxHorn();else R.punch=1}
function nextRadio(){aInit();A.rad=(A.rad+1)%4;A.step=0;if(A.c)A.next=A.c.currentTime+.1;const r=$('radn');r.textContent='📻 '+ST[A.rad].n;r.className='glass on';clearTimeout(nextRadio.t);nextRadio.t=setTimeout(()=>r.className='glass',2200)}
addEventListener('keydown',e=>{
 aInit();const k=e.key.length===1?e.key.toLowerCase():e.key;R.keys[k]=1;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(R.state==='title')return;
 if(k==='e'||k==='Enter')doAct();else if(k==='h')doHorn();else if(k==='f'&&!pl.car)R.punch=1;else if(k==='r')nextRadio();else if(k==='m'){R.state==='play'?openMap():(panel.className==='on'&&(hidePanel(),R.state='play'))}
 else if(k==='Escape'||k==='p'){if(R.state==='play')pause();else if(R.state==='pause'){hidePanel();R.state='play'}}
});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;R.keys[k]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('contextmenu',e=>e.preventDefault());
/* ===== HUD ===== */
let hudT=0;
function hud(dt){
 hudT-=dt;if(hudT>0)return;hudT=.1;
 $('money').textContent='$'+S.money.toLocaleString();
 const st=stars();$('stars').innerHTML=[1,2,3,4,5].map(i=>'<i class="'+(i<=st?'on':'')+'">★</i>').join('');$('stars').className=st&&R.lastSeen<4?'flash':'';
 $('hp').style.width=clamp(pl.hp,0,100)+'%';
 const c=pl.car;$('carbarw').style.display=c?'':'none';$('nitw').style.display=c?'':'none';
 if(c){$('chp').style.width=clamp(c.hp/c.m.hp*100,0,100)+'%';$('nit').style.width=c.nit+'%'}else{$('nitw').style.display='';$('nit').style.width=pl.stam+'%'}
 $('spd').innerHTML=Math.round((c?Math.hypot(c.vx,c.vy):0)*.26)+' <small>km/h</small>';
 $('rank').textContent='Rank '+rank()+' · '+S.jobs+' jobs';
 $('clock').textContent=(darkness()>.5?'🌙 ':'☀️ ')+hhmm()+(R.rain>0?' 🌧':'');
 $('bAct').textContent=c?'EXIT':'ENTER';
 const near=!c&&nearestCar(pl.x,pl.y,75);
 $('bAct').style.opacity=(c||near)?1:.45;
 $('bHb').style.display=c?'flex':'none';$('bNit').textContent=c?'NITRO':'SPRINT';$('bHorn').textContent=c?'HORN':'PUNCH';
 const o=$('obj'),M=R.M;
 if(M){const t=curTarget();o.style.display='block';const d=t?Math.round(dist(pl.x,pl.y,t.x,t.y)/15):0;
  let txt=M.type==='collect'?'Collect the cases ('+M.items+'/6)':M.type==='escape'?'Lose the police!':M.type==='race'?'Checkpoint '+Math.min(M.i+1,M.pts.length)+'/'+M.pts.length:t?t.txt:'';
  o.innerHTML='<b>'+M.name+'</b>'+txt+' · <span>'+(M.type==='escape'?'':d+'m · ')+Math.max(0,Math.ceil(M.t))+'s</span>'}
 else if(R.wp){o.style.display='block';o.innerHTML='<b>GPS</b><span>'+Math.round(dist(pl.x,pl.y,R.wp.x,R.wp.y)/15)+'m</span>'}
 else o.style.display='none';
 const sub=$('sub');let msg='';
 if(R.state==='play'){
  if(R.bust>.2)msg='🚔 Busted in '+Math.max(0,Math.ceil(2.2-R.bust))+'… move away!';
  else if(!c&&near)msg='Tap ENTER to '+(near.mine?'drive your car':near.kind==='traffic'?'steal this car (crime!)':'take this car');
  else if(!R.M&&R.givers.some(g=>g.cd<=0&&dist(pl.x,pl.y,g.x,g.y)<260))msg='Yellow circle = job. Step into it!';
 }
 sub.textContent=msg;sub.className='glass'+(msg?' on':'');
}
/* ===== loop ===== */
let last=0;
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(t-last)/1000||.016);last=t;R.dt=dt;
 if(R.state==='play'||R.state==='title'||R.state==='out')update(dt);
 if(R.state==='play'||R.state==='out')hud(dt);
 drawMM();render();
}
window.__g={R,S,pl,update,render,startGame,spawnTraffic,spawnCop,crime,stars,startMission,winM,enterCar,exitCar,doAct,GARAGE,POLICE,HOSP,blocks,PER,RW,WS,N,MODELS,openGarage,openMap,nodeXY,carVsCar,mkCar};
titleCard();R.state='title';
for(let k=0;k<22;k++)spawnTraffic(GARAGE.x,GARAGE.y,100,900);
